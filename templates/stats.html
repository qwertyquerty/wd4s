{% extends "layout.html" %}

{% block content %}
    <div class="row">
        <div class="column" id="run_time_hist"></div>
        <div class="column" id="zelda_cycle_hist"></div>
    </div>
    <div class="row">
        <div class="column" id="goats_time_hist"></div>
        <div class="column" id="run_completion_pie"></div>
    </div>
    <div class="row">
        <div class="column" id="gorge_void_pie"></div>
        <div class="column" id="run_vs_pb_scat"></div>
    </div>

    <script>
        {% set runs = Runs.select() | list %}

        Plotly.newPlot('run_time_hist', [{
            x: [
                {% for run in runs %}
                    {% if not run.dnf() %}
                        (new Date({{ run.time*1000 }})).toISOString(),
                    {% endif %}
                {% endfor %}
            ],
            nbinsx: 60,
            type: 'histogram',
            marker: {
                color: '#DDAB5411',
                line: {
                    color: "#DDAB54", 
                    width: 1
                }
            },
            insidetextfont: {
                color: "#d8e8ef",
            }
        }],
        {
            title: {
                text: 'Run Time Histogram',
                font: {
                    size: 24,
                    color: '#d8e8ef'
                }
            },
            xaxis: {
                autorange: 'reversed',
                type: 'date',
                tickformat: '%H:%M:%S',
                tickfont: {
                    size: 12,
                    color: '#d8e8ef'
                }
            },
            yaxis: {
                tickfont: {
                    size: 12,
                    color: '#d8e8ef'
                }
            },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)'
        }, {
            displayModeBar: false
        });

        Plotly.newPlot('zelda_cycle_hist', [{
            x: [
                {% for run in runs %}
                    {% if run.zelda() != None %}
                        "{{ run.zelda() }}",
                    {% endif %}
                {% endfor %}
            ],
            histfunc: "count",
            type: 'histogram',
            marker: {
                color: '#DDAB5411',
                line: {
                    color: "#DDAB54", 
                    width: 1
                }
            },
            insidetextfont: {
                color: "#d8e8ef",
            }
        }],
        {
            title: {
                text: 'Zelda Cycle Histogram',
                font: {
                    size: 24,
                    color: '#d8e8ef'
                }
            },
            xaxis: {
                tickfont: {
                    size: 12,
                    color: '#d8e8ef'
                },
                tickformat: ',d',
                dtick: 1
            },
            yaxis: {
                tickfont: {
                    size: 12,
                    color: '#d8e8ef'
                }
            },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)'
        }, {
            displayModeBar: false
        });

        Plotly.newPlot('goats_time_hist', [{
            x: [
                {% for run in runs %}
                    {% if run.goats_time is not none %}
                        {{ run.goats_time }},
                    {% endif %}
                {% endfor %}
            ],
            xbins: { size: 1 },
            type: 'histogram',
            marker: {
                color: '#DDAB5411',
                line: {
                    color: "#DDAB54",
                    width: 1
                }
            },
            insidetextfont: {
                color: "#d8e8ef",
            }
        }],
        {
            title: {
                text: 'Goats Time Histogram',
                font: {
                    size: 24,
                    color: '#d8e8ef'
                }
            },
            xaxis: {
                autorange: 'reversed',
                tickfont: {
                    size: 12,
                    color: '#d8e8ef'
                }
            },
            yaxis: {
                tickfont: {
                    size: 12,
                    color: '#d8e8ef'
                }
            },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)'
        }, {
            displayModeBar: false
        });


        {% set completion_stats = Runs.completion_stats() %}
        Plotly.newPlot('run_completion_pie', [{
            values: [
                {{ completion_stats["pb"] }},
                {{ completion_stats["completed"] - completion_stats["pb"] }},
                {{ completion_stats["dnf"] }}
            ],
            labels: [
                "Personal Best", "Completed", "DNF"
            ],
            type: 'pie',
            marker: {
                colors: ['#50b64922', '#DDAB5422', '#de2c2622'],
                line: {
                    color: "#DDAB54", 
                    width: 1
                }
            },
            insidetextfont: {
                color: "#d8e8ef",
            }
        }],
        {
            title: {
                text: 'Run Completion',
                font: {
                    size: 24,
                    color: '#d8e8ef'
                }
            },
            xaxis: {
                autorange: 'reversed',
                type: 'date',
                tickformat: '%H:%M:%S',
                tickfont: {
                    size: 12,
                    color: '#d8e8ef'
                }
            },
            yaxis: {
                tickfont: {
                    size: 12,
                    color: '#d8e8ef'
                },
                mode: 'markers',
                dtick: 1
            },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)'
        }, {
            displayModeBar: false
        });
        Plotly.newPlot('run_vs_pb_scat', [{
            x: [
                {% for run in runs %}
                    {% if not run.dnf() %}
                        {% set player = Players.get_or_none(Players.id == run.player) %}
                        {% if player and player.pb %}
                            (new Date({{ player.pb * 1000 }})).toISOString(),
                        {% endif %}
                    {% endif %}
                {% endfor %}
            ],
            y: [
                {% for run in runs %}
                    {% if not run.dnf() %}
                        {% set player = Players.get_or_none(Players.id == run.player) %}
                        {% if player and player.pb %}
                            (new Date({{ run.time * 1000 }})).toISOString(),
                        {% endif %}
                    {% endif %}
                {% endfor %}
            ],
            mode: 'markers',
            type: 'scatter',
            marker: {
                color: '#DDAB54',
                line: { color: '#DDAB54', width: 2 }
            }
        }], {
            title: {
                text: 'Run Time vs Personal Best',
                font: { size: 24, color: '#d8e8ef' }
            },
            xaxis: {
                title: { text: 'Personal Best', font: { color: '#a7a7a7' } },
                autorange: 'reversed',
                type: 'date',
                tickformat: '%H:%M:%S',
                tickfont: { size: 12, color: '#d8e8ef' }
            },
            yaxis: {
                title: { text: 'Run Time', font: { color: '#a7a7a7' } },
                autorange: 'reversed',
                type: 'date',
                tickformat: '%H:%M:%S',
                tickfont: { size: 12, color: '#d8e8ef' }
            },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)'
        }, { displayModeBar: false });

        {% set gorge_success = runs | selectattr('gorge_void', 'equalto', 1) | list | length %}
        {% set gorge_fail    = runs | selectattr('gorge_void', 'equalto', 0) | list | length %}
        Plotly.newPlot('gorge_void_pie', [{
            values: [{{ gorge_success }}, {{ gorge_fail }}],
            labels: ['Success', 'Fail'],
            type: 'pie',
            marker: {
                colors: ['#50b64922', '#de2c2622'],
                line: { color: "#DDAB54", width: 1 }
            },
            insidetextfont: { color: "#d8e8ef" }
        }], {
            title: {
                text: 'Gorge Void Consistency',
                font: { size: 24, color: '#d8e8ef' }
            },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)'
        }, { displayModeBar: false });
    </script>
    <br><br>
{% endblock %}

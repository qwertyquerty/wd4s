{% macro link_name(name, eliminated=0) -%}{% set player = Players.get_or_none(Players.id == name) %}<a {% if eliminated %}style="color: #cc4444;"{% endif %} href="https://www.speedrun.com/users/{{ player.speedruncom if player and player.speedruncom else name }}">{{ name }}</a>{% endmacro %}

<html lang="en">
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="static/css/brackets-viewer.min.css" />
        <script type="text/javascript" src="static/brackets-viewer.min.js"></script>
        <script src="static/brackets-manager.js"></script>

        <title>Wolfdash 5</title>

        <link rel="stylesheet" href="static/css/dark.css" />

        <meta property="og:title" content="Wolfdash 5" />
        <meta property="og:image" content="static/wd5.png" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:site_name" content="Twilight Princess Community" />

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src='https://cdn.plot.ly/plotly-2.32.0.min.js'></script>
        
        <script>
        $(function(){
	        $('div[onload]').trigger('onload');
        });
        </script>

        {% block head %}
        {% endblock %}    
    </head>

    <body>
        <image src="static/wd5.png" class="logo"></image>
        <br/>
        <nav>
            <a href="{{ url_for('page_stats') }}" class="{% if request.endpoint == 'page_stats' %}active{% endif %}">Stats</a>
            <a>-</a>
            <a href="{{ url_for('page_runs') }}" class="{% if request.endpoint == 'page_runs' %}active{% endif %}">Runs</a>
            <a>-</a>
            <a href="{{ url_for('page_index') }}" class="{% if request.endpoint == 'page_index' %}active{% endif %}">Bracket</a>
            <a>-</a>
            <a href="{{ url_for('page_schedule') }}" class="{% if request.endpoint == 'page_schedule' %}active{% endif %}">Schedule</a>
            <a>-</a>
            <a href="{{ url_for('page_players') }}" class="{% if request.endpoint == 'page_players' %}active{% endif %}">Players</a>
        </nav>

        {% block content %}
        {% endblock %}
        <footer class="footer">
            <div style="text-align: center;">
                <strong>Wolfdash 5</strong> website made with &lt;3 by <a href="https://github.com/qwertyquerty">Maddie</a>
            </div>
        </footer>
    </body>
</html>
